name: Native Linux builds
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: ubuntu26
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: ubuntu26
          - runner: ubuntu-24.04
            arch: x86_64
            target: fedora44
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: fedora44
          - runner: ubuntu-24.04
            arch: x86_64
            target: cachyos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test native packages
        run: scripts/build-linux.sh "${{ matrix.target }}"
      - name: Install and verify on the target distribution
        run: scripts/verify-linux-packages.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/linux/${{ matrix.target }}/${{ matrix.arch }}/
          retention-days: 14
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: linux-*
          path: release-files
          merge-multiple: true
      - name: Publish checked Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* \
              --title "Deckard $RELEASE_TAG — native Rust" \
              --notes-file docs/release-notes.md \
              --verify-tag
          fi
