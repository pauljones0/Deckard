# pyproject.toml — tool configuration ONLY, deliberately.
# Deckard is not pip-installed anywhere: the flatpak manifest copies the tree
# (io.github.nazbert.Deckard.yml: `cp . /app/bin/Deckard -r`), the AUR package
# builds a venv from requirements.txt and copies the tree to /opt/deckard, and
# the release flow reads the root VERSION file (release.config.mjs,
# .gitlab-ci.yml build:flatpak). No [project]/[build-system] table on purpose.

[tool.ruff]
target-version = "py313"   # deployment floor: flatpak GNOME 50 runtime / AUR python313

[tool.ruff.lint]
select = [
  "F401",  # unused imports
  "E711",  # == None / != None
  "E712",  # == True / == False
  "B006",  # mutable default args — shared silently across every default caller
  "F541",  # f-strings without placeholders
  "E722",  # bare `except:` — house style is a narrow except or @log.catch
  "B030",  # `except` handlers that aren't exception classes/tuples
  "SIM105",  # try/except/pass that a contextlib.suppress states as intent
]

[tool.ruff.lint.per-file-ignores]
# This module sits at its grandfathered module-size cap. Its one suppressible
# swallow is left for a separate change that nets no new line here. Drop this
# entry once that swallow reads as contextlib.suppress.
"src/backend/DeckManagement/deck_controller/media_writer.py" = ["SIM105"]

[tool.pyright]
# Editor/LSP navigation config only. The type gate is ty (lint:types).
# Every checkout root carries this section, so a server or CLI rooted in a git
# worktree resolves that branch's own files. The server reads it once, at
# start; a change here needs a fresh server, not a config touch.
venvPath = "."
venv = ".venv"               # resolves loguru, rpyc, gi (PyGObject-stubs), ... for hover and go-to-definition.
                             # Worktrees carry no venv: run scripts/worktree-env.sh there once, which
                             # symlinks the primary checkout's (gitignored, and excluded below via **/.*).
pythonVersion = "3.13"       # deployment floor, same as ruff target-version and ty python-version
exclude = [
  "aur-deckard-git",         # holds a full copy of the tree; indexing it duplicates every symbol
  "**/__pycache__",          # from here down: pyright's defaults, restated because exclude replaces them
  "**/.*",                   # covers .venv, .claude/worktrees
]
executionEnvironments = [
  { root = "tests", extraPaths = [".", "tests"] },  # scenarios do `import fixtures` (harness sys.path) plus repo-root `src...` imports
]

[tool.ty.environment]
python-version = "3.13"      # deployment floor: flatpak GNOME 50 runtime / AUR python313
python = ".venv"             # ty resolves third-party imports from a real environment, not from stubs alone

[tool.ty.src]
# The checked set, written out rather than globbed. A glob of the root modules
# reaches tests/ and scripts/ as well, which hold ~1600 diagnostics of their
# own and are not governed here. Root modules are named one by one so adding
# one to the gate is a deliberate edit; main.py in particular is only reachable
# this way, because nothing imports it.
include = [
    "src",
    "GtkHelper",
    "locales",
    "appinfo.py",
    "autostart.py",
    "cli_args.py",
    "globals.py",
    "main.py",
    "rebrand_migration.py",
]

[tool.ty.rules]
# Rules ty ships off by default and this tree holds at zero. Each reported no
# hits when it was turned on, so each is a line held rather than a debt taken.
missing-type-argument = "error"             # a bare generic decays; the type arguments are written out
possibly-missing-attribute = "error"        # an attribute only some branches assign
possibly-missing-import = "error"           # an import only some branches make
possibly-unresolved-reference = "error"     # a name read on a path that may not have bound it
unsound-yield = "error"                     # a yielded value the declared yield type does not cover
division-by-zero = "error"
blanket-ignore-comment = "error"            # a suppression names the rule it suppresses
unsupported-dynamic-base = "error"          # a base class ty cannot compute hides the whole surface
dynamic-function-decorator-return = "error" # a decorator that erases the wrapped signature
unsound-return-statement = "error"          # a returned value is Any-tainted, assignable but not a subtype
missing-override-decorator = "error"        # a method that overrides a base declares @override

[[tool.ty.overrides]]
# Both modules are deprecated whole. Their own annotations and their Gio.ListStore
# and GObject signal registrations must name the deprecated item class, so the
# deprecation machinery reports itself. The rule stays live everywhere else.
include = ["GtkHelper/ItemListComboRow.py", "GtkHelper/SearchComboRow.py"]

[tool.ty.overrides.rules]
deprecated = "ignore"

[[tool.ty.overrides]]
# Deferred: these files are under open touch-strip work; the unsound returns
# here get fixed once that lands.
include = [
    "src/backend/DeckManagement/deck_controller/background_media.py",
    "src/backend/DeckManagement/deck_controller/controller.py",
    "src/backend/DeckManagement/deck_controller/gif_pipeline.py",
    "src/backend/DeckManagement/deck_controller/inputs.py",
]

[tool.ty.overrides.rules]
unsound-return-statement = "ignore"

[[tool.ty.overrides]]
# Deferred: these files are under open touch-strip work; their override
# decorators get added once that lands.
include = [
    "src/backend/DeckManagement/deck_controller/inputs.py",
    "src/backend/DeckManagement/deck_controller/gif_pipeline.py",
    "src/backend/DeckManagement/deck_controller/media_writer.py",
]

[tool.ty.overrides.rules]
missing-override-decorator = "ignore"
