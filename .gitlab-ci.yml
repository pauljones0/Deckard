# Native checks for GitLab mirrors. Downloadable releases are built by
# .github/workflows/linux.yml on native x86-64 and ARM64 runners.
# The inherited Python/Flatpak publisher is retained for source history only
# in packaging/legacy/gitlab-ci.yml; it must not publish this Rust release.
stages: [test]
native:test:
  image: rust:1.99-bookworm
  stage: test
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config cmake nasm libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libegl1-mesa-dev
    - rustup component add clippy rustfmt
  script:
    - cargo test --workspace --locked
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo fmt --all -- --check
