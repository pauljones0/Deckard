# Deckard CI — flatpak bundle releases (design in
# docs/ci-flatpak-releases-plan.md).
#
# Shape (the same skeleton the sibling projects share):
#   test     — byte-compile smoke over the tree (cheap syntax gate; the real
#              gate is the flatpak build itself) + advisory changelog nudge.
#   build    — flatpak-builder produces a single-file x86_64 .flatpak bundle
#              from THIS checkout. The committed manifest builds the Deckard
#              module from its GitHub repo (right for flathub, wrong for CI),
#              so the job derives a CI manifest whose app module points at a
#              clean `git archive` export of $CI_COMMIT_SHA — the same rewrite
#              flatpak/install.sh does interactively with yq.
#   release  — the shared bump-labeled-MR bot (auto-release +
#              tag-release) stamping VERSION + CHANGELOG.md, a GitLab Release
#              with the bundle attached on vX.Y.Z tags, then a mirror of that
#              release (object + bundle) to the GitHub fork.
#
# The fork's release version is the root VERSION file (see release.config.mjs)
# — NOT globals.py's app_version, which stays upstream-aligned because plugins
# gate on it for compatibility checks.
#
# Runner requirement: flatpak-builder sandboxes module builds with bubblewrap,
# which must mount a fresh /proc inside its user namespace. Docker masks paths
# under /proc, and the kernel's locked-mounts rule rejects a procfs mount in a
# userns unless proc is fully visible — capabilities, seccomp and apparmor
# settings don't reach this (the gnome image runs as uid 1000, so cap_add is
# moot; verified empirically on the runner host). build:flatpak
# therefore MUST run on the dedicated privileged runner (tag `flatpak`,
# run_untagged=false — privilege is scoped to jobs that ask for it), the same
# arrangement GNOME/flathub use for their builders. rofiles-fuse stays
# disabled to keep the build independent of FUSE availability.

# Single pipeline per change: MR pipeline when an MR is open, branch pipeline
# otherwise, plus tags (the tag pipeline is the binding release gate).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages: [test, build, release]

variables:
  APP_ID: io.github.nazbert.Deckard
  # Pinned release tooling (the bump-labeled-MR bot).
  CI_AUTOMATION_REF: v0.3.0

# ── test ─────────────────────────────────────────────────────────────────────
# Syntax-level gate only: compileall byte-compiles every python file without
# importing it (imports need GTK4/PyGObject, which this image does not carry).
# The scenario harness (tests/run_all.py) does need that stack, so it runs in
# test:scenarios below, which provisions GTK from the distro and starts by hand.
#
# The module-size ratchet rides along here because it has the same shape: pure
# stdlib, no imports of the tree, so it needs nothing this image lacks. It caps
# how long any module under src/ or GtkHelper/ may grow and holds the deck
# controller shim to a re-export surface; the rules and the per-file caps live
# in the script.
#
# The gl slot freeze is the same shape again: it pins the set of process-wide
# slots globals.py declares, and checks that nothing assigns a slot outside it,
# so growing the shared namespace is a deliberate two-file edit rather than a
# line nobody notices. The inventory and the rules live in that script.
#
# The settings-json ratchet is the same shape once more: it fails on any
# json.load/json.dump of a settings file outside a per-file allowlist, so adding
# a raw reader (instead of routing it through the settings store, which heals a
# corrupt file and writes atomically) is a deliberate, reviewed edit. Its
# allowlist and rules live in that script; --self-test proves it goes red.
#
# The type-gate coverage guard is the same shape a fourth time, and it is what
# makes lint:types mean anything. The type checker takes an explicit list of
# paths to check. A path in that list that does not exist is not an error to
# it: it drops the entry, checks what is left, and exits 0. So a renamed tree,
# or a new top-level package nobody added to the list, silently stops being
# checked while the gate stays green. This guard fails on either.
test:compile:
  stage: test
  image: python:3.13-slim   # 3.13 = the runtime python req2flatpak targets
  interruptible: true
  needs: []
  script:
    - python -m compileall -q *.py src GtkHelper tests scripts
    - python scripts/check_module_sizes.py
    - python scripts/check_gl_slots.py
    - python scripts/check_settings_json.py
    - python scripts/check_type_gate.py
    - pip install --quiet "$(grep -oE '^PyYAML==[0-9.]+' requirements-dev.txt)"
    - python scripts/check_ci_release_gates.py --self-test
    # This job's image is the deployment floor, and 3.13 evaluates a parameter
    # and return annotation at def time where the 3.14 dev venv defers it, so
    # this is the only place an unevaluatable annotation shows up.
    - python scripts/check_eager_annotations.py

# Lint gate. Rule selection lives in pyproject.toml and is an explicit
# allowlist -- no rule is enabled until its population is clean, so this job
# is green the day it lands. Tool versions come out of requirements-dev.txt so
# the pin can't drift from the one developers install.
lint:ruff:
  stage: test
  image: python:3.13-slim
  interruptible: true
  needs: []
  script:
    - pip install --quiet "$(grep -oE '^ruff==[0-9.]+' requirements-dev.txt)"
    - ruff --version
    - ruff check .

# Blocking type-check gate: the tree is at zero ty diagnostics and must stay
# there. ty exits 1 on a warning too, so a warning-level rule blocks the same
# way an error does.
#
# ty resolves third-party imports from a real Python environment, not from
# stubs alone, so this job builds .venv from requirements.txt and the checker
# sees the same types a developer sees. That is why the job needs no
# CI-versus-local reconciliation: a suppression that is right here is right
# there. PyGObject is the one exception -- its pycairo chain needs GObject
# headers no python image carries -- so gi types come from PyGObject-stubs,
# exactly as they do locally.
#
# Not the slim image: evdev ships no wheel and builds from source, and the
# checker needs its real types.
lint:types:
  stage: test
  image: python:3.13   # deployment floor, and it carries the toolchain evdev needs
  interruptible: true
  needs: []
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .pip-cache
  script:
    - python -m venv .venv
    - .venv/bin/pip install --quiet --upgrade pip
    - grep -v '^PyGObject==' requirements.txt > /tmp/req-typecheck.txt
    - .venv/bin/pip install --quiet -r /tmp/req-typecheck.txt
    # quoted: the ' #' inside the regex would otherwise start a YAML comment
    - ".venv/bin/pip install --quiet $(grep -oE '^(types-setuptools|types-requests)==[^ #]+' requirements-dev.txt)"
    # --no-deps: the stubs hard-depend on PyGObject, which this image cannot
    # build. They are type-time-only, so their runtime deps are dead weight.
    - ".venv/bin/pip install --quiet --no-deps $(grep -oE '^PyGObject-stubs==[^ #]+' requirements-dev.txt)"
    - "pip install --quiet $(grep -oE '^ty==[^ #]+' requirements-dev.txt)"
    - ty version
    - ty check

# Advisory nudge: an MR should either add a bullet under ## [Unreleased] in
# CHANGELOG.md or carry the no-changelog label. auto-release adds MR-title
# fallback bullets for anything that slips through, so this never blocks.
changelog-check:
  stage: test
  image: node:22
  needs: []
  allow_failure: true
  variables:
    GIT_DEPTH: "0"   # need real history to diff against the MR base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      case ",$CI_MERGE_REQUEST_LABELS," in
        *,no-changelog,*) echo "label 'no-changelog' set — check skipped"; exit 0;;
      esac
      git fetch -q origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA" 2>/dev/null || true
      if git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA"...HEAD | grep -qx 'CHANGELOG.md'; then
        echo "CHANGELOG.md updated ✓"
      else
        echo "This MR neither updates CHANGELOG.md (add a bullet under ## [Unreleased])"
        echo "nor carries the 'no-changelog' label. Advisory only — not blocking."
        exit 1
      fi

# Scenario-suite provisioning shared by the blocking smoke job and the
# on-demand full suite. Each scenario runs in its own subprocess and boots the
# real GTK4 stack. The runner host also serves GitLab, so resource_group holds
# the project to one run at a time.
#
# The image mirrors provisioning that is known to work on a developer host,
# rather than a build invented for CI. Trixie's python3 is 3.13, the deployment
# floor, and its python3-gi is the PyGObject version requirements.txt pins. The
# venv is therefore created with --system-site-packages, so pip sees PyGObject
# satisfied and never rebuilds the bindings against headers this image does not
# carry. A python:3.13 image does not work here: its /usr/local interpreter
# cannot see the distro dist-packages, which is what the whole arrangement
# rests on.
#
# Package notes. gir1.2-xdp-1.0 is the easy one to forget: autostart.py
# requires the Xdp typelib at import time, so without it every scenario fails
# identically. dbus-daemon is a hard requirement of the scenarios that raise a
# private bus. gcc and libc6-dev are there for evdev alone, which ships no
# wheel and builds from source. xauth is what xvfb-run uses to authorise its
# display, and --no-install-recommends leaves it out otherwise. git is for the
# scenarios that walk the tracked file list or build fixture repositories; the
# runner clones with its own helper, so the image does not carry it.
#
# The gi import is checked before the suite starts, because one clear error
# reads better than hundreds of identical tracebacks.
#
# The suite itself runs as a created non-root user. Two scenario families
# encode assumptions a root process breaks: abort paths proven by chmod-denied
# writes (root ignores permission bits), and redaction checks that expect a
# real /home/<user> shape. Setup stays root (apt, venv, pip); the tree is
# handed over just before the run.
#
# SCENARIO_LIST selects an ordered, tracked subset. SCENARIO_K remains for
# ad-hoc narrowing of the full suite. SCENARIO_JOBS sets the parallel width,
# and SCENARIO_TIMEOUT the per-scenario limit, which is wider than the harness
# default because the host is shared.
.scenario-suite:
  stage: test
  image: debian:trixie-slim
  interruptible: true
  resource_group: scenario-suite   # the runner host also serves GitLab itself
  variables:
    SCENARIO_K: ""          # optional: run only scenarios matching one substring
    SCENARIO_LIST: ""       # optional: run a tracked list of exact scenario names
    SCENARIO_JOBS: "4"
    SCENARIO_TIMEOUT: "300"
    DEBIAN_FRONTEND: noninteractive
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .pip-cache
  before_script:
    - apt-get update -qq
    - |
      apt-get install -y -qq --no-install-recommends \
        python3 python3-gi python3-venv python3-dev pkg-config gcc libc6-dev \
        gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-xdp-1.0 libadwaita-1-0 \
        dbus-daemon xvfb xauth git
    - python3 -m venv --system-site-packages .venv
    - .venv/bin/pip install --quiet --upgrade pip
    - .venv/bin/pip install --quiet -r requirements.txt
    - |
      .venv/bin/python -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; print('gi', gi.__version__, 'Gtk', Gtk.get_major_version())"
  script:
    - |
      set -e
      if [ -n "$SCENARIO_LIST" ]; then
        set -- --scenario-list "$SCENARIO_LIST"
      elif [ -n "$SCENARIO_K" ]; then
        set -- -k "$SCENARIO_K"
      else
        set --
      fi
      useradd -m scenario
      chown -R scenario:scenario "$CI_PROJECT_DIR"
      runuser -u scenario -- env HOME=/home/scenario USER=scenario LOGNAME=scenario \
        xvfb-run -a nice -n 10 .venv/bin/python tests/run_all.py "$@" \
        --jobs "$SCENARIO_JOBS" --timeout "$SCENARIO_TIMEOUT" \
        --junit scenarios-junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: scenarios-junit.xml
    paths:
      - scenarios-junit.xml

# Blocking representative coverage for merge requests and release-producing
# pipelines. The manifest owns the exact selection so membership changes are
# ordinary, reviewable diffs.
test:scenario-smoke:
  extends: .scenario-suite
  needs: []
  variables:
    SCENARIO_LIST: tests/scenario-smoke.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# On-demand full suite. It remains manual and advisory on merge requests and
# the default branch, so hardware-dependent and longer scenarios can be run
# without delaying the normal pipeline.
test:scenarios:
  extends: .scenario-suite
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

# ── build ────────────────────────────────────────────────────────────────────
# Stages a workspace so flatpak-builder never ingests CI cruft:
#   build-ws/src              clean `git archive` export of $CI_COMMIT_SHA
#   build-ws/shared-modules   flathub shared-modules (the manifest references
#                             libusb from it; this repo carries no submodule)
#   build-ws/<manifest>       committed manifest with the app module's sources
#                             swapped to {type: dir, path: src}
# The gnome-runtime-images image ships flatpak-builder plus the matching
# org.gnome.{Platform,Sdk}//50 preinstalled — no runtime download per job.
# pypi-requirements.yaml pins every wheel by URL+sha256 (req2flatpak), so
# flatpak-builder pre-fetches them into the cached state dir; the only
# uncached network is the wheel/module fetch on a cache miss plus the
# shared-modules clone.
build:flatpak:
  stage: build
  image: quay.io/gnome_infrastructure/gnome-runtime-images:gnome-50
  tags: [flatpak]   # the dedicated privileged runner (see header)
  interruptible: true
  needs: []
  cache:
    key:
      files:
        - io.github.nazbert.Deckard.yml
        - pypi-requirements.yaml
    paths:
      - .flatpak-builder/downloads
      - .flatpak-builder/git
      - .flatpak-builder/ccache
      - .flatpak-builder/checksums
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # MRs: automatic when packaging inputs change, manual (non-blocking)
    # otherwise — the build takes tens of minutes on a cold cache.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - io.github.nazbert.Deckard.yml
        - pypi-requirements.yaml
        - flatpak/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  script:
    # The image's user differs from the checkout's owner — git refuses to
    # operate on "dubiously owned" repos without this.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 -c "import yaml" 2>/dev/null || pip3 install --user --quiet PyYAML
    - mkdir -p build-ws/src dist
    - git archive "$CI_COMMIT_SHA" | tar -x -C build-ws/src
    - cp io.github.nazbert.Deckard.yml pypi-requirements.yaml build-ws/
    - git clone --depth 1 https://github.com/flathub/shared-modules.git build-ws/shared-modules
    - python3 flatpak/ci/make_ci_manifest.py build-ws/io.github.nazbert.Deckard.yml src
    - cd build-ws
    - flatpak-builder --user --disable-rofiles-fuse --force-clean
        --state-dir="$CI_PROJECT_DIR/.flatpak-builder"
        --repo=repo build-dir io.github.nazbert.Deckard.yml
    # Bundle name: tag pipelines get the clean release version; branch/MR
    # pipelines get VERSION+shortsha so unstable bundles are identifiable.
    - VERSION_REF="${CI_COMMIT_TAG:-$(cat "$CI_PROJECT_DIR/VERSION")+${CI_COMMIT_SHORT_SHA}}"
    - VERSION_REF="${VERSION_REF#v}"
    - flatpak build-bundle repo "$CI_PROJECT_DIR/dist/deckard-${VERSION_REF}-x86_64.flatpak" "$APP_ID"
    - ls -lh "$CI_PROJECT_DIR/dist/"
  artifacts:
    paths:
      - dist/
    expire_in: 2 weeks

# ── release (strict vX.Y.Z tags) ─────────────────────────────────────────────
# This barrier makes the static checks, scenario smoke suite, and release build
# a single prerequisite for every job that can create a tag or release. It
# deliberately downloads no artifacts: the publishing jobs retain their direct
# build dependency so the Flatpak bundle remains available where it is uploaded.
release:gate:
  stage: release
  image: alpine:3.22
  interruptible: true
  needs:
    - job: test:compile
      artifacts: false
    - job: lint:ruff
      artifacts: false
    - job: lint:types
      artifacts: false
    - job: test:scenario-smoke
      artifacts: false
    - job: build:flatpak
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "Static gates, scenario smoke suite, and release build passed."

# Upload the bundle to the generic package registry (durable, unlike the
# 2-week CI artifacts), then create the GitLab Release with notes from this
# version's CHANGELOG.md section and the bundle linked as a package asset.
# release-cli is driven directly so the notes pass through a file — the
# declarative release:description is shell-expanded by GitLab, so backticks
# in changelog bullets would execute (the airsensor audit-X16 lesson).
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false
  needs:
    - job: build:flatpak
      artifacts: true
    - job: release:gate
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache curl
  script:
    - |
      set -e
      VERSION="${CI_COMMIT_TAG#v}"
      awk -v v="## [$VERSION]" 'index($0,v)==1{g=1;next} /^## \[/{g=0} g' CHANGELOG.md > release_notes.md
      [ -s release_notes.md ] || printf 'Deckard %s\n' "$CI_COMMIT_TAG" > release_notes.md
      echo "----- release notes -----"; cat release_notes.md

      asset="deckard-${VERSION}-x86_64.flatpak"
      url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/deckard/${VERSION}/${asset}"
      echo "Uploading $asset to the generic package registry"
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "dist/$asset" "$url"

      release-cli create --tag-name "$CI_COMMIT_TAG" --name "Deckard $CI_COMMIT_TAG" \
        --description "$(cat release_notes.md)" \
        --assets-link "{\"name\":\"$asset\",\"url\":\"$url\",\"link_type\":\"package\"}"

# ── release mirror (GitHub fork) ─────────────────────────────────────────────
# Reproduce the just-cut GitLab release on github.com/nazbert/Deckard. A GitLab
# push mirror (Settings → Repository → Mirroring) already carries branches +
# tags to the fork; a mirror moves git refs ONLY, so this job adds what it
# can't — the Release object and the flatpak asset. Kept downstream of
# release:gitlab (needs it) so GitHub is only ever cut for releases GitLab also
# got; GitLab stays the source of truth. Pure curl+jq against the REST API (no
# gh dependency) and idempotent, so a retry / re-tag reconciles rather than
# 422s. Naming/asset are kept identical to release:gitlab on purpose so both
# releases read the same.
#
# NEEDS a GH_TOKEN project variable (masked + protected; a fine-grained PAT
# scoped to the fork repo, Contents: read/write). Protected so it is exposed
# only on protected v* tag pipelines — never on MR/branch runs.
release:github:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest   # alpine; has apk
  interruptible: false
  variables:
    GITHUB_REPO: nazbert/Deckard
    GIT_DEPTH: "0"   # full history so the tag push is self-sufficient even if
                     # the async mirror hasn't landed this commit yet (a shallow
                     # push of an unknown commit is rejected)
  needs:
    - job: build:flatpak
      artifacts: true
    - job: release:gate
      artifacts: false
    - job: release:gitlab      # GitHub is strictly downstream of the canonical release
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apk add --no-cache curl jq git
  script:
    - |
      set -eu
      : "${GH_TOKEN:?set GH_TOKEN (masked+protected CI var: fine-grained PAT, Contents:rw on the fork)}"
      VERSION="${CI_COMMIT_TAG#v}"
      asset="deckard-${VERSION}-x86_64.flatpak"
      api="https://api.github.com/repos/${GITHUB_REPO}"
      auth="Authorization: Bearer ${GH_TOKEN}"

      # Re-derive the notes exactly as release:gitlab did (artifacts aren't
      # shared) so both releases carry identical text.
      awk -v v="## [$VERSION]" 'index($0,v)==1{g=1;next} /^## \[/{g=0} g' CHANGELOG.md > release_notes.md
      [ -s release_notes.md ] || printf 'Deckard %s\n' "$CI_COMMIT_TAG" > release_notes.md
      echo "----- release notes -----"; cat release_notes.md

      # Land the tag on GitHub ourselves rather than trusting the async mirror's
      # timing. Not forced: an identical ref is a no-op, a divergent one fails
      # loudly instead of silently rewriting a published tag. The push drags
      # whatever commit objects the release target needs.
      git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPO}.git" \
        "$CI_COMMIT_SHA:refs/tags/$CI_COMMIT_TAG"

      # Idempotent release: reuse an existing one (job retry / re-tag), else create.
      rid=$(curl -sS -H "$auth" "$api/releases/tags/$CI_COMMIT_TAG" | jq -r '.id // empty')
      if [ -z "$rid" ]; then
        rid=$(jq -n --arg t "$CI_COMMIT_TAG" --arg c "$CI_COMMIT_SHA" \
                    --arg n "Deckard $CI_COMMIT_TAG" --rawfile b release_notes.md \
                    '{tag_name:$t, target_commitish:$c, name:$n, body:$b}' \
              | curl -sS --fail -X POST -H "$auth" -H "Content-Type: application/json" \
                     -d @- "$api/releases" | jq -r '.id')
      fi
      echo "GitHub release id: $rid"

      # Replace any same-named asset first so a retry re-uploads cleanly, then
      # push the bundle to the uploads host.
      curl -sS -H "$auth" "$api/releases/$rid/assets" \
        | jq -r --arg n "$asset" '.[] | select(.name==$n) | .id' \
        | while read -r aid; do curl -sS -X DELETE -H "$auth" "$api/releases/assets/$aid"; done
      curl -sS --fail -X POST -H "$auth" -H "Content-Type: application/octet-stream" \
        --data-binary @"dist/$asset" \
        "https://uploads.github.com/repos/${GITHUB_REPO}/releases/$rid/assets?name=$asset"
      echo "Mirrored $asset to GitHub release $CI_COMMIT_TAG"

# ── release automation (pinned shared tooling) ───────────────────────────────
# A bump:*-labeled MR merged to main IS the release: auto-release stamps
# VERSION + CHANGELOG.md, commits `release: vX.Y.Z` (no skip-ci marker, so the
# tag pipeline runs), pushes with -o ci.skip, and tags vX.Y.Z. The tag then
# drives build:flatpak + release:gitlab above. NEEDS a RELEASE_BOT_TOKEN
# project variable (api + write_repository; allowed to push protected main
# and create protected v* tags) and this project on ci-automation's job-token
# allowlist. Set DRY_RUN=1 to rehearse; AUTO_RELEASE_DISABLED=1 to stop it.
.release:
  image: node:22
  cache: []
  # The release commit reaches the public mirror, so this pins the identity it
  # carries. The release tooling writes a name and an address of its own into
  # the repo config; git reads the identity environment ahead of the config, so
  # these values win. Set the same four names as project CI variables to change
  # what a release commit publishes.
  variables:
    GIT_AUTHOR_NAME: "Deckard release bot"
    GIT_AUTHOR_EMAIL: "noreply@github.com"
    GIT_COMMITTER_NAME: "Deckard release bot"
    GIT_COMMITTER_EMAIL: "noreply@github.com"
  before_script:
    - git clone --depth 1 --branch "$CI_AUTOMATION_REF"
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/nb-labs/ci-automation.git" .ci-automation

auto-release:
  extends: .release
  stage: release
  needs: ["release:gate"]
  resource_group: release
  interruptible: false
  variables:
    GIT_DEPTH: "0"   # full history: last-tag discovery + tag dates
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - git fetch -q --tags origin
    - node .ci-automation/src/cli.mjs auto-release

# Manual-fallback safety net: every main push, cheap + idempotent — tag
# vX.Y.Z iff VERSION holds X.Y.Z with a matching CHANGELOG section and no tag
# yet. This is also the bootstrap path: the MR introducing this pipeline
# hand-stamps VERSION=0.1.0 + CHANGELOG, so merging it cuts v0.1.0.
tag-release:
  extends: .release
  stage: release
  needs: ["release:gate"]
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - node .ci-automation/src/cli.mjs tag-release
